# C2PA Flutter Plugin - CI/CD Pipeline
#
# This workflow runs on every push and pull request to ensure code quality
# and build integrity across all supported platforms.

name: CI

on:
  push:
    branches: [main, develop]
  # Every pull request, including ones stacked on another PR's branch.
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  # =============================================================================
  # Code Quality Checks
  # =============================================================================
  analyze:
    name: Analyze
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Check the Pigeon bindings are current
        run: |
          dart run pigeon --input pigeons/c2pa_api.dart
          dart format lib/src/c2pa_api.g.dart
          git diff --exit-code -- lib/src/c2pa_api.g.dart android/src/main/kotlin ios/c2pa_flutter/Sources

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos

  # =============================================================================
  # Unit Tests
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Run unit tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # Android Build
  # =============================================================================
  build-android:
    name: Build Android
    runs-on: macos-15
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          cd example && flutter pub get

      - name: Build Android APK (debug)
        run: cd example && flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # =============================================================================
  # iOS Build
  # =============================================================================
  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        # c2pa-swift 0.1.x declares swift-tools-version 6.3 (Xcode 26.4+).
        run: |
          xcodebuild -version
          version=$(xcodebuild -version | awk '/^Xcode/ {print $2}')
          major=${version%%.*}; rest=${version#*.}; minor=${rest%%.*}
          if [ "$major" -lt 26 ] || { [ "$major" -eq 26 ] && [ "$minor" -lt 4 ]; }; then
            echo "Xcode $version is older than 26.4, which c2pa-swift requires"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Xcode DerivedData
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-deriveddata-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('example/pubspec.lock', 'ios/c2pa_flutter/Package.swift') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          cd example && flutter pub get

      - name: Build iOS (no codesign)
        run: cd example && flutter build ios --no-codesign --simulator

  # =============================================================================
  # Integration Tests - Android
  # =============================================================================
  integration-tests-android:
    name: Integration Tests (Android)
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          script: cd example && flutter test integration_test/
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true

  # =============================================================================
  # Integration Tests - iOS
  # =============================================================================
  integration-tests-ios:
    name: Integration Tests (iOS)
    runs-on: macos-26
    needs: build-ios
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        # c2pa-swift 0.1.x declares swift-tools-version 6.3 (Xcode 26.4+).
        run: |
          xcodebuild -version
          version=$(xcodebuild -version | awk '/^Xcode/ {print $2}')
          major=${version%%.*}; rest=${version#*.}; minor=${rest%%.*}
          if [ "$major" -lt 26 ] || { [ "$major" -eq 26 ] && [ "$minor" -lt 4 ]; }; then
            echo "Xcode $version is older than 26.4, which c2pa-swift requires"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Xcode DerivedData
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-deriveddata-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('example/pubspec.lock', 'ios/c2pa_flutter/Package.swift') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          cd example && flutter pub get

      - name: Clean stale build caches
        run: cd example && flutter clean && flutter pub get

      - name: Ensure Simulator is Available
        run: |
          # Use the newest installed iOS runtime and an iPhone it supports.
          RUNTIME_ID=$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rts.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          print(rts[-1]["identifier"] if rts else "")
          ')
          if [ -z "$RUNTIME_ID" ]; then
            echo "ERROR: no iOS simulator runtime installed"
            xcrun simctl list runtimes
            exit 1
          fi
          DEVICE_TYPE=$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          rt = next(r for r in json.load(sys.stdin)["runtimes"] if r["identifier"] == sys.argv[1])
          phones = [d for d in rt.get("supportedDeviceTypes", []) if d["productFamily"] == "iPhone" and "Pro" not in d["name"] and "Plus" not in d["name"]]
          print(phones[-1]["identifier"] if phones else "")
          ' "$RUNTIME_ID")
          echo "Runtime: $RUNTIME_ID"
          echo "Device type: $DEVICE_TYPE"
          DEVICE_ID=$(xcrun simctl create "c2pa-ci" "$DEVICE_TYPE" "$RUNTIME_ID")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      # Each file runs on its own with a verbose log. The wrapper retries an
      # attempt that stalls in flutter's VM service discovery, which happens
      # intermittently on hosted simulators. Every file runs even when an
      # earlier one fails; the step fails at the end if any did.
      - name: Run integration tests
        timeout-minutes: 180
        run: |
          cd example
          failed=()
          for test in integration_test/*_test.dart; do
            name=$(basename "$test" .dart)
            echo "::group::$name"
            if ! ../.github/scripts/ios-integration-test.sh "$test" "../ios-$name.log"; then
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

      - name: Show the tail of the test logs
        if: always()
        run: |
          for f in ios-*.log; do
            [ -f "$f" ] && { echo "=== $f"; tail -80 "$f"; }
          done
          exit 0

  # =============================================================================
  # Publish Check
  # =============================================================================
  publish-check:
    name: Publish Check
    runs-on: macos-15
    needs: [build-android, build-ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Check publish readiness
        run: flutter pub publish --dry-run

  # =============================================================================
  # Summary Job
  # =============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [analyze, unit-tests, build-android, build-ios, integration-tests-android, integration-tests-ios, publish-check]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.analyze.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.build-android.result }}" != "success" ]] || \
             [[ "${{ needs.build-ios.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests-android.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests-ios.result }}" != "success" ]] || \
             [[ "${{ needs.publish-check.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
